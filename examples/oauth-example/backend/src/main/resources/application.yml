spring:
  application:
    name: oauth-client-backend
  datasource:
    url: ${OAUTH_DB_URL:jdbc:mysql://localhost:13306/oauth_client_demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${OAUTH_DB_USERNAME:root}
    password: ${OAUTH_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null

server:
  port: ${OAUTH_BACKEND_PORT:8081}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

vocoor:
  oauth:
    server-url: ${OAUTH_SERVER_URL:http://localhost:8080}
    client-id: ${OAUTH_CLIENT_ID:}
    client-secret: ${OAUTH_CLIENT_SECRET:}
    redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:8081/api/oauth/callback}
    default-scope: ${OAUTH_DEFAULT_SCOPE:profile phone company}
    frontend-url: ${OAUTH_FRONTEND_URL:http://localhost:4010}

jwt:
  secret: ${OAUTH_JWT_SECRET}
  expiration: ${OAUTH_JWT_EXPIRATION:7200}

nebula:
  data:
    persistence:
      enabled: false
    cache:
      enabled: false
  web:
    performance:
      enabled: true
  security:
    jwt:
      secret: ${OAUTH_JWT_SECRET}
      expiration: ${OAUTH_JWT_EXPIRATION:7200}

logging:
  level:
    io.nebula.examples.oauth: INFO
    org.springframework.web: INFO
