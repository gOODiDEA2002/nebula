server:
  port: ${USER_HTTP_PORT:1001}

spring:
  application:
    name: nebula-example-user-service
  grpc:
    server:
      port: ${USER_GRPC_PORT:2001}

nebula:
  security:
    jwt:
      secret: ${JWT_SECRET:nebula-user-service-dev-secret-key-at-least-32-bytes}
  data:
    persistence:
      enabled: false
    cache:
      enabled: false
  discovery:
    nacos:
      enabled: true
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:public}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      group-name: ${NACOS_GROUP:DEFAULT_GROUP}
      cluster-name: ${NACOS_CLUSTER:DEFAULT}
      auto-register: true
      metadata:
        version: 1.0.0
        env: ${APP_ENV:dev}
  rpc:
    discovery:
      enabled: false
    http:
      enabled: true
      server:
        enabled: true
        port: ${server.port}
        context-path: /rpc
      client:
        enabled: false
    grpc:
      enabled: true
      server:
        enabled: true
      client:
        enabled: false
  messaging:
    rabbitmq:
      enabled: false
  lock:
    enabled: false

logging:
  level:
    io.nebula: DEBUG
    io.nebula.example.user: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
