# ==================================================
# Async RPC Client 配置文件
# 作为 RPC 服务消费方，演示异步调用
# ==================================================

server:
  port: ${CLIENT_PORT:8082}

grpc:
  server:
    port: -1
spring:
  application:
    name: ${CLIENT_APP_NAME:async-rpc-client}
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# ==================================================
# Nebula 框架配置
# ==================================================
nebula:
  security:
    jwt:
      secret: ${JWT_SECRET:nebula-rpc-async-client-dev-secret-key-at-least-32-bytes}
  data:
    persistence:
      enabled: false
    cache:
      enabled: false
  # 服务发现配置（Nacos）
  discovery:
    nacos:
      enabled: true
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:public}
      group-name: ${NACOS_GROUP:DEFAULT_GROUP}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}

  # RPC 配置
  rpc:
    http:
      enabled: true
      server:
        enabled: false
        port: ${server.port}
      client:
        enabled: true
        connect-timeout: 30000
        read-timeout: 120000  # 较长的超时以支持耗时调用
    
    # RPC 服务发现集成
    discovery:
      enabled: true
      load-balance-strategy: round_robin
    
    # 异步 RPC 配置
    async:
      enabled: true
      storage:
        type: nacos  # 使用 Nacos 存储执行状态
        nacos:
          server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
          namespace: ${NACOS_NAMESPACE:public}
          username: ${NACOS_USERNAME:nacos}
          password: ${NACOS_PASSWORD:nacos}
      executor:
        core-pool-size: ${ASYNC_CORE_POOL_SIZE:10}
        max-pool-size: ${ASYNC_MAX_POOL_SIZE:50}
        queue-capacity: ${ASYNC_QUEUE_CAPACITY:200}
        thread-name-prefix: async-rpc-
      cleanup:
        enabled: true
        retention-days: 7
    grpc:
      enabled: false
  messaging:
    rabbitmq:
      enabled: false
  lock:
    enabled: false

# ==================================================
# 日志配置
# ==================================================
logging:
  level:
    root: INFO
    io.nebula: DEBUG
    io.nebula.example: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ==================================================
# Actuator 监控配置
# ==================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
