# ==================================================
# Data Process Service 配置文件
# 作为 RPC 服务提供方
# ==================================================

server:
  port: ${SERVICE_PORT:8081}

grpc:
  server:
    port: -1
spring:
  application:
    name: ${SERVICE_APP_NAME:data-process-service}

# ==================================================
# Nebula 框架配置
# ==================================================
nebula:
  security:
    jwt:
      secret: ${JWT_SECRET:nebula-rpc-async-service-dev-secret-key-at-least-32-bytes}
  data:
    persistence:
      enabled: false
    cache:
      enabled: false
  # 服务发现配置（Nacos）
  discovery:
    nacos:
      enabled: true
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:public}
      group-name: ${NACOS_GROUP:DEFAULT_GROUP}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      auto-register: true  # 启用服务自动注册

  # RPC 配置
  rpc:
    discovery:
      enabled: false
    http:
      enabled: true
      server:
        enabled: true
        port: ${server.port}
        context-path: /rpc
      client:
        enabled: false
        connect-timeout: 30000
        read-timeout: 60000
    grpc:
      enabled: false
  messaging:
    rabbitmq:
      enabled: false
  lock:
    enabled: false

# ==================================================
# 日志配置
# ==================================================
logging:
  level:
    root: INFO
    io.nebula: DEBUG
    io.nebula.example: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ==================================================
# Actuator 监控配置
# ==================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
