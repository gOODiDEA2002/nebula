spring:
  application:
    name: starter-ai-example
server:
  port: ${SERVER_PORT:8083}
nebula:
  security:
    jwt:
      secret: ${JWT_SECRET:nebula-starter-ai-example-dev-secret-key-at-least-32-bytes}
  data:
    cache:
      enabled: false
  ai:
    enabled: ${AI_ENABLED:false}
    openai:
      api-key: ${vocoor_hy3_token:${OPENAI_API_KEY:}}
      base-url: ${OPENAI_BASE_URL:https://tokenhub.tencentmaas.com/v1}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:hy3}
          temperature: 0.1
          max-tokens: 64
          max-retries: ${OPENAI_MAX_RETRIES:0}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:kinfra-text-embedding-0.6b}
          max-retries: ${OPENAI_MAX_RETRIES:0}
    vector-store:
      chroma:
        host: ${CHROMA_HOST:localhost}
        port: ${CHROMA_PORT:9002}
        collection-name: ${CHROMA_COLLECTION:nebula_vectors}
        initialize-schema: true
